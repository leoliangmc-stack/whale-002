name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 保留上一版的资源文件
        # 刚部署完时浏览器或 CDN 可能还拿着旧页面 / 旧清单，旧文件还在就不会缺声音或白屏（见脚本说明）
        run: |
          if git fetch -q --depth 1 origin gh-pages; then
            mkdir -p ../previous
            git archive FETCH_HEAD | tar -x -C ../previous
            node scripts/keep-previous-assets.mjs ../previous dist
          fi
      - name: 发布到 gh-pages 分支
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "部署：构建自 ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
